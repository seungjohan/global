# About Section
# about_title: About Me
about_profile_image: images/profile.jpg
about_content: | # this will include new lines to allow paragraphs
  I am Product Manager with Zero-to-One builder, having <mark>Ownership</mark>, Diverse experiences, and <mark>Cross-function</mark> with expertise in solving problems, product management across software and business, design, and Digital Analysis.<br/>
  Proven successes in leading market initiatives in collaboration with cross-functional teams and external markets, constant test & learn, and developing service based on customer's feedback.

  As a Product Manager and leader, I focus on **collaborating with diverse perspectives, designing features that drive value, listening to people’s voices, and reflecting on new technologies at a fast pace through feedback.** <br/>

  With 2 years of experience in Product Management, I founded a Startup of E-commerced based Food tech web•mobile service and led projects in Global Business in Travel, Music with Metaverse, Sales, Proptech, Supply Chain, and other various steps. I have tried to be mainly a Cross-functional Product Manager but also Software Developer and Business developer in various industries in order to understand the whole flow of products and the way of delivering impact to the end-user.<br/>

  I strongly feel responsible and motivated for technological innovation and social impact with software product which can deliver positive life change to people from all over the world.
# I try constantly to challenge myself.<br/>
# Experiences in business, software engineering, communication, and leadership have enabled me to become the professional I am today.<br/>
# My main goal is to leave my mark in line with my personal ideas, drawing on my past experiences to promote the ongoing expansion of innovation in the company.


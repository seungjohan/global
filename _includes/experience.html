<div class="container experience-container">
  <h3>{{ include.profile.experience_title | default: site.experience_title | default: "Experience" }}</h3>
  {% assign items = include.items | default: site.data.experience %}
  {% for experience in items %}
    {% include {{ experience.layout | default: 'left' | append: ".html" }} item=experience %}
  {% endfor %}
</div>
